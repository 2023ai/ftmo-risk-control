groups:
  - name: ftmo-risk-control
    rules:
      - alert: FtmoRiskDatabaseDown
        expr: ftmo_risk_database_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: FTMO risk SQLite state is unavailable
          description: Stop all risk-increasing trading until state is healthy.

      - alert: FtmoRiskStateIntegrityFailed
        expr: ftmo_risk_database_up == 1 and ftmo_risk_state_integrity_ok == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: FTMO risk state has semantic integrity errors
          description: Stop new risk and inspect the decision, execution, reservation, and credential relationships before recovery.

      - alert: FtmoRiskRuleConfigurationDrift
        expr: ftmo_risk_rule_config_consistent == 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: FTMO risk rule configuration changed without a new rule version
          description: Keep new risk blocked, restore the approved configuration or publish the reviewed policy under a new rule_version.

      - alert: FtmoRiskNotReady
        expr: ftmo_risk_ready_for_risk_increase == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: FTMO risk service is not ready for new risk
          description: Persistent state or a required calendar is unavailable, stale, or under-covered.

      - alert: FtmoRiskInsecureRemoteBind
        expr: ftmo_risk_remote_bind == 1 and ftmo_risk_insecure_remote_bind == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: FTMO risk API is using remote plain HTTP
          description: Restrict the listener to an isolated private network or enable TLS before allowing production traffic.

      - alert: FtmoRiskNewsCalendarMissing
        expr: ftmo_risk_calendar_present{calendar="news"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: News calendar is missing
          description: Risk-increasing trading is fail-closed without news data.

      - alert: FtmoRiskNewsCalendarStale
        expr: ftmo_risk_calendar_present{calendar="news"} == 1 and ftmo_risk_calendar_stale{calendar="news"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: News calendar is stale
          description: News data is stale or tied to an inactive rule version.

      - alert: FtmoRiskCalendarRuleVersionMismatch
        expr: increase(ftmo_risk_calendar_restore_total{result="rule_mismatch"}[5m]) > 0 or (ftmo_risk_calendar_present == 1 and ftmo_risk_calendar_rule_version_match == 0)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Calendar uses or attempted to restore an inactive rule version
          description: Resynchronize the calendar with the rule version currently pinned by the service; a rejected restore may leave the calendar absent and is covered by the restore counter.

      - alert: FtmoRiskCalendarCoverageInsufficient
        expr: ftmo_risk_calendar_present == 1 and ftmo_risk_calendar_coverage_sufficient == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: A risk calendar does not cover the active guard horizon
          description: Publish a reviewed calendar with coverage spanning the full look-behind and look-ahead window.

      - alert: FtmoRiskMarketCalendarMissing
        expr: ftmo_risk_calendar_present{calendar="market"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Market closure calendar is missing
          description: Risk-increasing trading is fail-closed without closures.

      - alert: FtmoRiskMarketCalendarStale
        expr: ftmo_risk_calendar_present{calendar="market"} == 1 and ftmo_risk_calendar_stale{calendar="market"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Market closure calendar is stale
          description: Closure data is stale or tied to an inactive rule version.

      - alert: FtmoRiskUnknownExecution
        expr: ftmo_risk_unknown_execution_records > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: One or more execution outcomes are unknown
          description: Reconcile platform orders before releasing reservations.

      - alert: FtmoRiskExecutionReservationStuck
        expr: ftmo_risk_unresolved_execution_reservations > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Execution risk reservations remain unresolved
          description: Check pending and unknown platform orders; unresolved reservations continue to consume risk budget.

      - alert: FtmoRiskCredentialExpiring
        expr: ftmo_risk_credentials_expiring_soon > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: An account credential expires within 24 hours
          description: Rotate the account credential and verify platform synchronization.

      - alert: FtmoRiskQualificationSnapshotStale
        expr: ftmo_risk_qualification_snapshots_stale > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A qualification snapshot is stale
          description: The qualification dashboard must remain in manual-review state until account data is refreshed.

      - alert: FtmoRiskOfficialBreach
        expr: ftmo_risk_account_status{status="BREACH"} > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: An account has a latched official breach
          description: Keep the account blocked and start compliance review.

      - alert: FtmoRiskBackupFailed
        expr: increase(ftmo_risk_backup_runs_total{operation="backup",result="failure"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: A state backup failed
          description: Inspect storage permissions, capacity, and SQLite health.

      - alert: FtmoRiskBackupOverdue
        expr: ftmo_risk_last_backup_age_seconds < 0 or ftmo_risk_last_backup_age_seconds > 90000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: State backup is missing or overdue
          description: No successful state backup has completed within 25 hours.
