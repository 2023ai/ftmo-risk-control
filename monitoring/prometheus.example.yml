global:
  scrape_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: ftmo-risk-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/ftmo-risk-admin-token
    static_configs:
      - targets:
          - 127.0.0.1:8765
